version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      FREELLMAPI_BASE_URL: "http://host.docker.internal:3001/v1"
      FREELLMAPI_API_KEY: "replace-me"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - backend
    restart: unless-stopped
