services:
  - type: web
    name: apex-executive-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FREELLMAPI_BASE_URL
        sync: false
      - key: FREELLMAPI_API_KEY
        sync: false

  - type: web
    name: apex-executive-frontend
    runtime: node
    rootDir: web
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_API_URL
        value: https://apex-executive-backend.onrender.com
