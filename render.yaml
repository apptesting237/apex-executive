services:
  - type: web
    name: apex-executive-web
    runtime: node
    rootDir: web
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port 10000
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://apex-executive-backend.onrender.com
